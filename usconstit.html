          link.style.textDecoration = 'underline';
        });
      });
    }

  <script>
    (function() {
      // Check every 5 minutes (300000 milliseconds)
      const CHECK_INTERVAL = 300000;
      
      function checkRedirectsFile() {
        fetch('/_redirects', {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache'
          }
        })
        .then(response => response.text())
        .then(content => {
          // Check if the file contains "/ /503 302" (maintenance mode active)
          if (content.includes('/ /503 302')) {
            console.log('Maintenance mode detected, redirecting to 503 page...');
            window.location.href = 'https://northpoint.website/503';
          } else {
            console.log('Redirects file checked - no maintenance mode');
          }
        })
        .catch(error => {
          console.error('Error checking _redirects file:', error);
        });
      }
      
      // Run check immediately on page load
      checkRedirectsFile();
      
      // Then check every 5 minutes
      setInterval(checkRedirectsFile, CHECK_INTERVAL);
    })();
  </script>
